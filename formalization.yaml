fidelity:
  divergences: 'Relative to the cited source (the erdosproblems.com statement) there is no divergence: the compared
    theorem is its direct formalisation, with trees on `k+1` vertices and the hypothesis `|E| ≥ (k-1)n/2 + 1`. Relative
    to the classical phrasing of the Erdős–Sós conjecture ("more than `(t-2)n/2` edges, trees on `t` vertices";
    here `t = k+1`) there is one marginal difference: when `(k-1)n` is odd, `|E| > (k-1)n/2` already holds with
    one edge fewer than `|E| ≥ (k-1)n/2 + 1` requires, so in that parity case the compared theorem assumes half
    an edge more and is very slightly weaker than the classical statement (the classical statement implies it, not
    conversely). The Lean proof''s internal counting lemma derives `2|E(G)| ≤ (k-1)n` whenever the tree is absent,
    which is the sharp classical bound, but only the advertised statement is compared. The vertex type `Fin n` loses
    no generality; `G.edgeSet.ncard` is the number of edges; `T.IsTree` and `T.IsContained G` are Mathlib''s notions
    (containment as a not necessarily induced subgraph); `k + 1 ≤ n` is `n ≥ k+1`.'
review:
