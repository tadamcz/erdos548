        retry waits)
      spend_usd: 363 USD for the primary resolution, computed from its token counts at GPT-6 Astra's standard rates
        (USD 10 per million input tokens, 50 per million output tokens, 1 per million cache-read tokens and 12.50
        per million cache-write tokens)
      hardware: API-only inference; the agent's sandbox ran on Epoch AI's cloud evaluation infrastructure (Hawk)
